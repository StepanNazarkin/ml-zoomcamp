name: ML Zoomcamp CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Set up Python
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies
        run: |
          uv sync

      - name: Check formatting and linting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run unit tests
        run: |
          uv run pytest || { [ $? -eq 5 ] && echo "No tests found, passing gracefully."; }